[project]
name = "finalgrade"
version = "0.2.1"
description = "Final course grades from a Gradescope or Canvas csv export, by a grading policy you write down once"
authors = [
    {name = "Matt Higger",email = "mhigger@ccs.neu.edu"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["grading", "grades", "gradebook", "gradescope", "canvas", "teaching"]
# an explicit list replaces the python versions poetry derives from
# requires-python, so they are spelled out rather than quietly dropped
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "numpy (>=2.2.2,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "ruamel-yaml (>=0.18.10,<0.19.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]

[project.urls]
Homepage = "https://matthigger.github.io/finalgrade"
Repository = "https://github.com/matthigger/finalgrade"
Documentation = "https://github.com/matthigger/finalgrade/blob/main/doc/policy.md"
Issues = "https://github.com/matthigger/finalgrade/issues"

[project.scripts]
finalgrade = "finalgrade.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
hypothesis = "^6.0.0"

[tool.pytest.ini_options]
testpaths = ["test"]
# warnings are part of this package's user interface (missing emails, policy
# problems).  make them loud in the test suite so they can't be ignored.
filterwarnings = ["error"]

