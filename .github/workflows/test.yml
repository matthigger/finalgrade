name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest hypothesis

      - name: test
        run: pytest -q

  # the page ships app.js verbatim, so a syntax error in it is a page that
  # loads, spins, and never says why -- the browser is the only thing that
  # was parsing it.  node is already on the runner
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: app.js parses
        run: node --check web/app.js
