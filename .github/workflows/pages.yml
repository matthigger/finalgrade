name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# one deploy at a time, and never cancel one half way through
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      # the site is the page plus a wheel of this commit, so the browser
      # always runs the same code the tests just ran
      - name: build site
        run: python web/build.py --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
